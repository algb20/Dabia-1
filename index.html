<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل حساب جديد - Dabia</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background-color: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #333; border-radius: 5px; background-color: #2a2a2a; color: white; text-align: center; }
        button { width: 95%; padding: 10px; background-color: #24b47e; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1cb874; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>إنشاء حساب في Dabia</h2>
        <form id="registerForm">
            <input type="text" id="username" placeholder="اسم المستخدم" required>
            <input type="email" id="email" placeholder="البريد الإلكتروني" required>
            <input type="password" id="password" placeholder="كلمة المرور" required>
            <button type="submit">تسجيل الحساب</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseUrl = 'https://fjeyhpasqhhqebqmhcmy.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqZXlocGFzcWhocWVicW1oY215Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTYyMDcsImV4cCI6MjA5NTgzMjIwN30.0eluGIJX-9QGgjsD_ipk1z688aWLW2fiuxqmeFGx4WI';

        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const emailValue = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // تم تعديل الكلمة هنا إلى emall لتطابق جدولك في السيرفر تماماً
            const { data, error } = await _supabase
                .from('Dabia')
                .insert([{ username: username, emall: emailValue, password: password }]);

            if (error) {
                console.error('خطأ أثناء الحفظ:', error.message);
                alert('فشل التسجيل: ' + error.message);
            } else {
                alert('ممتاز! تم إنشاء حسابك بنجاح في قاعدة بيانات دابيا السحابية.');
                document.getElementById('registerForm').reset();
            }
        });
    </script>
</body>
</html>
